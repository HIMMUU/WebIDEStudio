<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="CodeForge - A powerful VS Code-like web IDE with GitHub integration, Monaco Editor, and in-browser code execution. Load any GitHub repository and start coding instantly." />
    <meta property="og:title" content="CodeForge - Web IDE" />
    <meta property="og:description" content="A powerful VS Code-like web IDE with GitHub integration and in-browser code execution." />
    <meta property="og:type" content="website" />
    <title>CodeForge - Web IDE</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Suppress SharedArrayBuffer postMessage errors - graceful degradation
      const originalPostMessage = Worker.prototype.postMessage;
      Worker.prototype.postMessage = function(msg, options) {
        try {
          return originalPostMessage.call(this, msg, options);
        } catch (e) {
          if (e.message && e.message.includes('SharedArrayBuffer')) {
            console.warn('[CodeForge] SharedArrayBuffer not available in this environment');
            return; // Gracefully continue
          }
          throw e;
        }
      };
      
      window.addEventListener('error', (e) => {
        if (e.message && e.message.includes('SharedArrayBuffer')) {
          e.preventDefault();
          console.warn('[CodeForge] SharedArrayBuffer transfer not available');
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
